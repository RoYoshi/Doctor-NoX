# Doctor NoX CI: source tests, RPM build, package inspection, and an
# install with Fedora's RPM signature enforcement left on. The package is
# signed here with a throwaway key created in this job; that key is never
# published and its packages are never released. Releases: release.yml.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Fedora ${{ matrix.fedora }}
    runs-on: ubuntu-24.04
    container: fedora:${{ matrix.fedora }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # FE-XicoOS builds on Fedora 45; 44 remains its known fallback.
        fedora: [45, 44]
    steps:
      - name: Bootstrap Git
        timeout-minutes: 5
        run: dnf5 -y install --setopt=install_weak_deps=False git-core
      - uses: actions/checkout@v4
      - name: Install build and test tools
        timeout-minutes: 15
        run: |
          dnf5 -y install --setopt=install_weak_deps=False \
            rpm-build rpm-sign rpmlint python3-devel desktop-file-utils gnupg2 \
            python3-pyside6 python3-jsonschema dejavu-sans-fonts util-linux shadow-utils procps-ng hostname
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          printf '::notice title=Versions (Fedora %s)::%s; %s; %s; RPM signature policy %%_pkgverify_level=%s\n' \
            "${{ matrix.fedora }}" "$(python3 --version)" "$(rpm -q python3-pyside6)" "$(rpm --version)" "$(rpm -E '%_pkgverify_level')"
      - name: Source tests (including the PySide6 GUI tests)
        run: QT_QPA_PLATFORM=offscreen PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Build source tarball, SRPM and noarch RPM
        run: packaging/build-rpm.sh
      - name: Inspect the package
        run: |
          rpm=$(ls dist/doctor-nox-*.noarch.rpm)
          echo "## Files"; rpm -qpl "$rpm"
          echo "## Requires"; rpm -qpR "$rpm"
          echo "## Provides"; rpm -qp --provides "$rpm"
          printf '::notice title=Package::%s, %s bytes, sha256 %s\n' "$(basename "$rpm")" "$(stat -c %s "$rpm")" "$(sha256sum "$rpm" | cut -d' ' -f1)"
          printf '::notice title=Requires::%s\n' "$(rpm -qpR "$rpm" | grep -v '^rpmlib(' | sort -u | tr '\n' ' ')"
          python3 -I packaging/ci/check-package.py "$rpm"
          set +e
          rpmlint -r packaging/doctor-nox.rpmlintrc dist/*.rpm > rpmlint.txt 2>&1; rc=$?
          set -e
          cat rpmlint.txt
          summary="$(tail -n 1 rpmlint.txt)"
          if grep -qE '[1-9][0-9]* errors' <<<"$summary"; then echo "::error title=rpmlint::$summary"; exit 1; fi
          echo "::notice title=rpmlint::$summary"
      - name: Sign with a throwaway CI key and install with signature enforcement on
        run: |
          set -euo pipefail
          rpm=$(ls dist/doctor-nox-*.noarch.rpm)
          cp "$rpm" /tmp/unsigned.rpm
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --passphrase '' --quick-gen-key "Doctor NoX CI throwaway key (never published)" rsa3072 sign 1d
          fpr="$(gpg --with-colons --list-keys | awk -F: '/^fpr/ {print $10; exit}')"
          gpg --armor --export "$fpr" > /tmp/ci-key.asc
          rpmsign --define "_gpg_name $fpr" --addsign "$rpm"
          rpmkeys --import /tmp/ci-key.asc
          verify="$(rpmkeys --checksig "$rpm")"; echo "$verify"
          grep -Eq 'signatures.* OK$' <<<"$verify" || { echo "::error title=Signature::$verify"; exit 1; }
          # Enforcement is on: the unsigned build is refused by rpm itself.
          if [ "$(rpm -E '%_pkgverify_level')" = all ]; then
            if rpm --install --test /tmp/unsigned.rpm >/tmp/unsigned.txt 2>&1; then
              echo "::error title=Signature enforcement::rpm accepted an unsigned package"; exit 1
            fi
            echo "::notice title=Signature enforcement::rpm refuses the unsigned build: $(head -c 200 /tmp/unsigned.txt | tr '\n' ' ')"
          fi
          dnf5 -y install "$rpm"
          rpm -qi doctor-nox | head -n 12
      - name: Installed package as an unprivileged user (CLI, reports, GUI, equivalence)
        run: bash packaging/ci/check-installed.sh "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-nox-ci-fedora-${{ matrix.fedora }}
          path: dist/
          if-no-files-found: ignore
